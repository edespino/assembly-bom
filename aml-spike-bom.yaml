products:
  aml-spike:
    components:
      core:
        - name: amlsim
          url: https://github.com/IBM/AMLSim.git
          branch: master
          env:
            AMLSIM_CONF: conf.json
            AMLSIM_PARAM_DIR: paramFiles/1K
          steps:
            - clone
            - prepare
            - generate
            - build
            - run
            - load
        - name: pxf
          env:
            RELEASE_URL: "https://downloads.apache.org/incubator/cloudberry/2.2.0-incubating"
            KEYS_URL: "https://downloads.apache.org/incubator/cloudberry/KEYS"
            ARTIFACT_MATCH: "apache-cloudberry-pxf-2.2.0-incubating-src.tar.gz"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - build
            - install
            - prepare
            - start
        - name: polaris
          env:
            RELEASE_URL: "https://downloads.apache.org/polaris/1.8.0"
            KEYS_URL: "https://downloads.apache.org/polaris/KEYS"
            ARTIFACT_MATCH: "apache-polaris-1.8.0.tar.gz"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - build
            - run
        - name: lakehouse
          steps:
            - publish
        - name: kafka
          env:
            RELEASE_URL: "https://downloads.apache.org/kafka/4.4.0"
            KEYS_URL: "https://downloads.apache.org/kafka/KEYS"
            ARTIFACT_MATCH: "kafka-4.4.0-src.tgz"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - build
            - run
        - name: flink
          env:
            RELEASE_URL: "https://downloads.apache.org/flink/flink-2.1.3"
            KEYS_URL: "https://downloads.apache.org/flink/KEYS"
            ARTIFACT_MATCH: "flink-2.1.3-src.tgz"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - build
            - run
        - name: stream
          steps:
            - land
        - name: versions
          steps:
            - show
        - name: superset
          url: https://github.com/apache/superset.git
          branch: "6.1.0"
          env:
            SUPERSET_IMAGE: aml-superset:6.1.0
          steps:
            - clone
            - build
            - run
