products:
  apache-releases:
    components:
      core:
        # Apache Cloudberry - Incubator project, 2.2.0-rc3 vote
        - name: cloudberry
          env:
            RELEASE_VERSION: "2.2.0"
            RELEASE_CANDIDATE: "rc3"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/cloudberry/2.2.0-incubating-rc3"
            KEYS_URL: "https://downloads.apache.org/incubator/cloudberry/KEYS"
            EXPECTED_GP_VERSION: "2.2.0-incubating"
            EXPECTED_GP_BUILD: "13d3c58eaa0"
          configure_flags: |
            --disable-external-fts
            --enable-gpcloud
            --enable-gpfdist
            --enable-ic-proxy
            --enable-mapreduce
            --enable-orafce
            --enable-orca
            --enable-pax
            --enable-pxf
            --enable-tap-tests
            --with-gssapi
            --with-ldap
            --with-libbz2
            --with-libcurl
            --with-libxml
            --with-lz4
            --with-openssl
            --with-pam
            --with-perl
            --with-pgport=5432
            --with-python
            --with-ssl=openssl
            --with-uuid=e2fs
            --with-zstd
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-release-structure
            - apache-validate-compliance
            - apache-rat
            - apache-review-license-compliance
            - apache-build-release
            - apache-check-built-versions

        # Apache HugeGraph - Incubator project
        - name: hugegraph
          env:
            RELEASE_VERSION: "1.7.0"
            RELEASE_CANDIDATE: ""
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/hugegraph/1.7.0"
            KEYS_URL: "https://downloads.apache.org/incubator/hugegraph/KEYS"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-release-structure
            - apache-validate-compliance
            - apache-rat
            - build          # Builds Maven (Java) and Go projects
            - build-python   # Builds Python projects
            - apache-validate-build-artifacts
            - test

        # Apache Fluss - Incubator project
        - name: fluss
          env:
            RELEASE_VERSION: "0.8.0"
            RELEASE_CANDIDATE: "rc1"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/fluss/fluss-0.8.0-incubating-rc1"
            KEYS_URL: "https://dist.apache.org/repos/dist/release/incubator/fluss/KEYS"
            # Fluss uses <inherited>false</inherited> for RAT plugin
            # Must run via 'validate' lifecycle to use parent's exclusions
            # Skip spotless (requires JVM 11+) and enforcer (version checks)
            RAT_MAVEN_COMMAND: "validate -Dspotless.check.skip=true -Denforcer.skip=true -DskipTests"
            # Test mode: "unit" (default, faster) or "integration" (comprehensive)
            TEST_MODE: "unit"
            HADOOP_CLASSPATH: "/opt/hadoop-3.3.6/share/hadoop/common/*:/opt/hadoop-3.3.6/share/hadoop/common/lib/*:/opt/hadoop-3.3.6/share/hadoop/hdfs/*:/opt/hadoop-3.3.6/share/hadoop/hdfs/lib/*"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-compliance
            - apache-rat
            - build
            - apache-validate-build-artifacts
            - test

        # Apache GeaFlow - Incubator project
        - name: geaflow
          env:
            RELEASE_VERSION: "0.7.0"
            RELEASE_CANDIDATE: "rc3"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/geaflow/v0.7.0-rc3"
            KEYS_URL: "https://downloads.apache.org/incubator/geaflow/KEYS"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-compliance
            - apache-rat
            - build
            - apache-validate-build-artifacts
            - test

        # Apache Toree - Incubator project
        - name: toree
          env:
            RELEASE_VERSION: "0.6.0"
            RELEASE_CANDIDATE: "rc1"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/toree/0.6.0-incubating-rc1/toree"
            KEYS_URL: "https://dist.apache.org/repos/dist/release/incubator/toree/KEYS"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-compliance
            - apache-review-license-compliance

        # Apache Gluten - Incubator project
        - name: gluten
          env:
            RELEASE_VERSION: "1.5.0"
            RELEASE_CANDIDATE: "rc1"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/gluten/1.5.0-incubating-rc1"
            KEYS_URL: "https://dist.apache.org/repos/dist/dev/incubator/gluten/KEYS"
          steps:
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-validate-compliance
            - build
            - apache-validate-build-artifacts

        # Apache Casbin JCasbin. A new candidate replaces this env block.
        # Do not reimplement the checks as scratch scripts.
        - name: jcasbin
          env:
            RELEASE_VERSION: "1.100.0"
            RELEASE_CANDIDATE: "rc5"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/casbin/jcasbin-1.100.0-incubating-rc5"
            KEYS_URL: "https://downloads.apache.org/incubator/casbin/KEYS"
            RELEASE_COMMIT: "38766ce5c270d53a83544886a204693e575b08fe"
            SOURCE_REPO: "https://github.com/apache/casbin-jcasbin.git"
            SOURCE_TAG: "v1.100.0-rc5"
            CONFORMANCE_COMMIT: "c35c93d29063b8bc3bc2ef30b09943d344a289f4"
            CONFORMANCE_REPO: "https://github.com/apache/casbin.git"
            STAGING_URL: "https://repository.apache.org/content/repositories/orgapachecasbin-1006/org/apache/casbin/jcasbin/1.100.0"
            STAGING_ARTIFACTS: "jcasbin-1.100.0.jar jcasbin-1.100.0-sources.jar jcasbin-1.100.0-javadoc.jar jcasbin-1.100.0.pom"
            SIGNING_KEY_SUFFIX: "96E22C88"
          steps:
            - apache-require-source-identity
            - prepare
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-compare-to-tag
            - apache-validate-release-structure
            - apache-validate-compliance
            - apache-rat
            - apache-review-license-compliance
            - compare-source-archives
            - compare-to-commit
            - build
            - verify-staged
            - check-built-versions

        # Apache OzHera. A new candidate replaces this env block.
        # Do not reimplement the checks as scratch scripts.
        - name: ozhera
          env:
            RELEASE_VERSION: "2.2.7"
            RELEASE_CANDIDATE: "rc3"
            RELEASE_URL: "https://dist.apache.org/repos/dist/dev/incubator/ozhera/2.2.7-incubating-rc3"
            KEYS_URL: "https://downloads.apache.org/incubator/ozhera/KEYS"
            SOURCE_REPO: "https://github.com/apache/ozhera.git"
            SOURCE_TAG: "v2.2.7-incubating-rc3"
          steps:
            - apache-require-source-identity
            - apache-discover-and-verify-release
            - apache-extract-discovered
            - apache-compare-to-tag
            - prepare
            - apache-validate-release-structure
            - apache-validate-compliance
            - apache-rat
            - apache-review-license-compliance
            - build


      # Build tool dependencies
      dependencies:
        - name: sbt
          steps:
            - setup-repo
            - install
